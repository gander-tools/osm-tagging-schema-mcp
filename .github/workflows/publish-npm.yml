name: 2. Publish NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'NPM package version to publish (e.g., 1.2.3)'
        required: true
        type: string

# Minimal permissions at workflow level (principle of least privilege)
permissions: read-all

jobs:

  publish-npm:
    name: Build, Publish, Tag and Release
    runs-on: ubuntu-latest

    # Required permissions for complete release process
    permissions:
      id-token: write       # Required for npm provenance and SLSA attestations
      attestations: write   # Required for build provenance attestations
      contents: write      # Required for creating tags and GitHub releases
      pull-requests: write # Required for PR comments

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          disable-sudo: 'true'
          egress-policy: 'audit'

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Parse version inputs
        id: version
        run: |
          VERSION_WITHOUT_V="${{ inputs.version }}"
          if ! [[ "$VERSION_WITHOUT_V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$VERSION_WITHOUT_V'. Expected semantic version (e.g., 1.2.3)"
            exit 1
          fi
          echo "version=$VERSION_WITHOUT_V" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_WITHOUT_V}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install npm 11.12.1
        shell: bash
        run: npm install -g npm@11.12.1

      - name: Install Dependencies
        run: npm ci

      - name: Generate version.json
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Generating src/version.json with version $RELEASE_VERSION and build timestamp $BUILD_TIMESTAMP"
          cat > src/version.json <<EOF
          {
            "version": "$RELEASE_VERSION",
            "buildTimestamp": "$BUILD_TIMESTAMP"
          }
          EOF
          echo "✓ Generated src/version.json:"
          cat src/version.json

      - name: Verify package.json version matches release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "❌ Version mismatch detected:"
            echo "  package.json version: $PACKAGE_VERSION"
            echo "  Workflow input version: $RELEASE_VERSION"
            echo ""
            echo "package.json version must match the version specified in the workflow input."
            echo "Run the Prepare Release workflow first to bump the version in package.json."
            exit 1
          fi

          echo "✅ Version validation passed: $PACKAGE_VERSION"

      - name: Run Tests
        uses: ./.github/actions/run-tests

      - name: Copy version.json to dist/
        run: |
          cp src/version.json dist/version.json
          echo "✓ Copied version.json to dist/"
          ls -lh dist/version.json

      - name: Verify build artifacts
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "Error: Build artifact dist/index.js not found"
            exit 1
          fi
          echo "✓ Build artifacts verified"

      - name: Generate SBOM (Software Bill of Materials)
        run: |
          # Use npx to avoid npm install -g (Scorecard Pinned-Dependencies)
          npx --yes @cyclonedx/cyclonedx-npm@4.1.0 --output-file sbom.json
          echo "✓ SBOM generated: sbom.json"

      - name: Create tarball for attestation
        run: |
          # Use --ignore-scripts to prevent the prepare lifecycle hook (lefthook install)
          # from running during pack. The build is already done by the Run Tests step.
          # Without this, npm pack stdout would include lifecycle script output, causing
          # GITHUB_ENV to fail parsing multi-line content as KEY=VALUE pairs.
          TARBALL_NAME=$(npm pack --ignore-scripts)
          echo "TARBALL=${TARBALL_NAME}" >> "$GITHUB_ENV"
          echo "✓ Package tarball created: ${TARBALL_NAME}"

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ env.TARBALL }}

      - name: Generate SLSA SBOM attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ env.TARBALL }}
          sbom-path: sbom.json

      - name: Verify npm >= 11.12.1 for Trusted Publishers
        run: |
          CURRENT_NPM=$(npm --version)
          echo "Current npm version: $CURRENT_NPM"
          if [ "$(printf '%s\n' "11.12.1" "$CURRENT_NPM" | sort -V | head -n1)" = "11.12.1" ]; then
            echo "✓ npm version $CURRENT_NPM is sufficient (>= 11.12.1)"
          else
            echo "❌ Error: npm version $CURRENT_NPM is too old"
            echo "npm >= 11.12.1 is required for Trusted Publishers"
            echo "Update Node.js version in workflow or manually install newer npm"
            exit 1
          fi

      - name: Publish to NPM with provenance (Trusted Publishers)
        run: npm publish --provenance --access public
        # Note: No NODE_AUTH_TOKEN needed - npm uses OIDC authentication automatically
        # Requires: id-token: write permission and npm >= 11.12.1

      - name: Upload dist/ artifact for Docker build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # NOTE: SHA pinning required for security. IDE warnings are false positives.
        with:
          name: dist-${{ steps.version.outputs.tag }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Create dist tarball for release
        run: |
          tar czf dist.tar.gz dist/
          echo "✓ Created dist.tar.gz ($(du -h dist.tar.gz | cut -f1))"

      - name: Update GitHub Release with dist artifact
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.version.outputs.tag }}
          artifacts: dist.tar.gz
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 🚀 Automatically Published Release

            Version `${{ steps.version.outputs.version }}` has been successfully published:

            ### 📦 NPM Package
            - Package: [@gander-tools/osm-tagging-schema-mcp](https://www.npmjs.com/package/@gander-tools/osm-tagging-schema-mcp)
            - Install: `npx @gander-tools/osm-tagging-schema-mcp@${{ steps.version.outputs.version }}`

            ### 🐳 Docker Image
            Docker images built from this release use the same `dist/` artifact as the NPM package:
            - Pull: `docker pull ghcr.io/gander-tools/osm-tagging-schema-mcp:${{ steps.version.outputs.version }}`
            - Build artifact: `dist.tar.gz` (attached to this release)

            ### 🔐 Provenance & Security
            This package was published with comprehensive supply chain security:

            #### NPM Provenance
            - [npm provenance](https://docs.npmjs.com/generating-provenance-statements) enabled
            - Verified build from GitHub Actions
            - Cryptographic attestations linking package to source

            #### SLSA Build Provenance
            - SLSA Level 3 build provenance attestations
            - Tamper-proof build metadata
            - Verifiable build environment and process

            #### SBOM (Software Bill of Materials)
            - CycloneDX SBOM generated and attested
            - Complete dependency transparency
            - Supply chain risk assessment

            ### 🔍 Verification

            **Verify npm provenance:**
            ```bash
            npm audit signatures @gander-tools/osm-tagging-schema-mcp
            ```

            **Verify SLSA attestations:**
            ```bash
            gh attestation verify oci://ghcr.io/gander-tools/osm-tagging-schema-mcp:${{ steps.version.outputs.version }} --owner gander-tools
            ```

            ### 📋 Release Process

            **Release steps:**
            1. ✅ Build and test validation
            2. ✅ NPM package published with provenance
            3. ✅ Git tag created by Publish NPM workflow
            4. ✅ GitHub release updated with artifacts

            ### 📝 Changelog

            See [CHANGELOG.md](https://github.com/gander-tools/osm-tagging-schema-mcp/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md) for detailed changes in this release.
          draft: false
          prerelease: false

      - name: Log release info
        run: |
          echo "✅ Successfully published version ${{ steps.version.outputs.version }}"
          echo "📦 Package: @gander-tools/osm-tagging-schema-mcp@${{ steps.version.outputs.version }}"
          echo "🏷️  Tag: ${{ steps.version.outputs.tag }}"
