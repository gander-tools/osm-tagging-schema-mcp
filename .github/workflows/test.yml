name: Test

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "master" ]
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  # Detect which files changed to conditionally run jobs
  changes:
    name: Detect Changes
    # Skip change detection for manual triggers (always run all tests)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'biome.json'
              - 'Dockerfile*'
              - '.dockerignore'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'lefthook.yml'
              - '.c8rc.json'
              - '.nvmrc'
              - '.npmrc'
              - 'server.json'
              - '.env.example'
            docs:
              - '*.md'
              - 'LICENSE'
            any:
              - '**'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    name: Unit and Integration Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [26, 24]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install npm 11.19.1
        shell: bash
        run: npm install -g npm@11.19.1

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        uses: ./.github/actions/run-tests

  test-mcp:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    name: MCP Test
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.mcp-test.outputs.total }}
      passed: ${{ steps.mcp-test.outputs.passed }}
      failed: ${{ steps.mcp-test.outputs.failed }}
      skipped: ${{ steps.mcp-test.outputs.skipped }}
      success: ${{ steps.mcp-test-validate.outputs.success }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'

      - name: Install npm 11.19.1
        shell: bash
        run: npm install -g npm@11.19.1

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # npm must be newer than 11.5.1 for compatibility
      - name: Install tools
        run: npm install -g mcp-jest@1.2.0

      - name: Build
        run: npm run build

      - name: Run MCP Jest and parse results
        id: mcp-test
        run: |
            mcp-jest --config tests/mcp-jest.json --reporter json --report-output report.json 
            
            {
              echo "total=$(jq '.total' report.json)"
              echo "passed=$(jq '.passed' report.json)"
              echo "failed=$(jq '.failed' report.json)"
              echo "skipped=$(jq '.skipped' report.json)"
            } >> "$GITHUB_OUTPUT"
            
            echo "Results: $(echo "$OUTPUT" | jq '.passed')/$(echo "$OUTPUT" | jq '.total') passed"
            echo "=== End raw output ==="
      - name: Validate test results
        id: mcp-test-validate
        run: |
          TOTAL=${{ steps.mcp-test.outputs.total }}
          PASSED=${{ steps.mcp-test.outputs.passed }}
          FAILED=${{ steps.mcp-test.outputs.failed }}
          SKIPPED=${{ steps.mcp-test.outputs.skipped }}
          
          if [ "$TOTAL" -gt 0 ] && [ "$PASSED" -eq "$TOTAL" ] && [ "$FAILED" -eq 0 ] && [ "$SKIPPED" -eq 0 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "✅ All tests passed ($PASSED/$TOTAL)"
            exit 0
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "❌ Tests failed - Passed: $PASSED/$TOTAL, Failed: $FAILED, Skipped: $SKIPPED"
            exit 1
          fi
