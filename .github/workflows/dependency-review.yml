name: Dependency Review

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  # Detect which files changed to conditionally run dependency review
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            dependencies:
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - '.github/actions/**'

  dependency-review:
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    name: Review Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail the build on moderate or higher vulnerabilities
          fail-on-severity: moderate
          # Warn on OpenSSF Scorecard below this level (but don't fail)
          warn-on-openssf-scorecard-level: 3
          # Deny specific licenses (example: copyleft licenses if needed)
          # deny-licenses: GPL-2.0, LGPL-2.0
          # Allow specific licenses
          # allow-licenses: MIT, Apache-2.0, BSD-3-Clause, ISC
          # Deny packages from specific sources
          deny-packages: ''
          # Comment on PR with results
          comment-summary-in-pr: always
          # Show dependency changes including OpenSSF Scorecard
          show-openssf-scorecard: true
          # Don't use warn-only mode (we want to fail on critical issues)
          warn-only: false
