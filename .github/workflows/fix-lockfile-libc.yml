name: Fix Lockfile libc

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  fix-lockfile-libc:
    name: Fix Lockfile libc
    # Skip fork PRs — GITHUB_TOKEN has no write access to fork branches
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Block unexpected egress)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout base code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git credentials and identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch PR head and extract package-lock.json
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF" --depth=1
          # Extract only package-lock.json from the PR — no full branch checkout
          git show "origin/${HEAD_REF}:package-lock.json" > package-lock.json

      - name: Remove libc entries from package-lock.json
        run: |
          node - package-lock.json <<'SCRIPT'
          const fs = require("node:fs");
          const lockfilePath = process.argv[2];
          const lock = JSON.parse(fs.readFileSync(lockfilePath, "utf8"));
          let removed = 0;
          for (const pkg of Object.values(lock.packages ?? {})) {
            if (Object.prototype.hasOwnProperty.call(pkg, "libc")) {
              delete pkg.libc;
              removed++;
            }
          }
          if (removed > 0) {
            fs.writeFileSync(lockfilePath, `${JSON.stringify(lock, null, 2)}\n`);
            console.log(`Removed "libc" from ${removed} package(s)`);
          } else {
            console.log('No "libc" entries found — nothing to do');
          }
          SCRIPT

      - name: Commit and push fix if needed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Load PR head tree into index without touching the working tree
          git read-tree "origin/$HEAD_REF"
          # Stage the fixed file into the PR head index
          git add package-lock.json
          # Compare staged result against PR head — exit early if unchanged
          if git diff --cached --quiet "origin/$HEAD_REF" -- package-lock.json; then
            echo "Nothing to commit"
            exit 0
          fi
          # Build commit on top of PR head using plumbing (no hooks, no branch switch)
          NEW_TREE=$(git write-tree)
          HEAD_SHA=$(git rev-parse "origin/$HEAD_REF")
          NEW_COMMIT=$(git commit-tree "$NEW_TREE" -p "$HEAD_SHA" \
            -m "fix: remove libc constraints from package-lock.json")
          git push origin "${NEW_COMMIT}:refs/heads/${HEAD_REF}"
