name: Renovate Config Validation

on:
  pull_request:
    branches: ["**"]
    paths:
      - "renovate.json"
      - ".github/renovate.json"
      - ".github/renovate.json5"
      - ".renovaterc"
      - ".renovaterc.json"
      - ".renovaterc.json5"
  push:
    branches: ["master"]
    paths:
      - "renovate.json"
      - ".github/renovate.json"
      - ".github/renovate.json5"
      - ".renovaterc"
      - ".renovaterc.json"
      - ".renovaterc.json5"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate Config
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Renovate configuration
        uses: rinchsan/renovate-config-validator@8cf44ae5646f111f838a03ac7ebd4e1c1f9be983 # v0.2.1
        with:
          pattern: |
            renovate.json
            .github/renovate.json
            .github/renovate.json5
            .renovaterc
            .renovaterc.json
            .renovaterc.json5
