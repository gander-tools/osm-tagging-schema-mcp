name: Docker Build and Publish

on:
  # Automatic trigger after successful Release Please workflow
  # Note: This triggers AFTER the entire workflow completes, ensuring dist.tar.gz is uploaded
  workflow_run:
    workflows: ["Release Please"]
    types:
      - completed
    branches:
      - master

  # Manual trigger with build type selection
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type of build to create'
        required: true
        type: choice
        options:
          - release
          - edge
          - pr
        default: edge
      version:
        description: 'NPM package version to build (required for release builds, e.g., v1.2.3)'
        required: false
        type: string
      pr_number:
        description: 'Pull request number (required for PR builds, e.g., 123)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  extract-version:
    name: Extract Version and Validate
    runs-on: ubuntu-latest
    outputs:
      version-tag: ${{ steps.version.outputs.version-tag }}
      should-build: ${{ steps.version.outputs.should-build }}
      is-release: ${{ steps.version.outputs.is-release }}
      checkout-ref: ${{ steps.version.outputs.checkout-ref }}
      git-tag: ${{ steps.version.outputs.git-tag }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Extract version from trigger
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_TAG=""
          GIT_TAG=""
          SHOULD_BUILD="false"
          IS_RELEASE="false"
          CHECKOUT_REF=""

          # workflow_run - triggered after Release Please workflow completes
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Check if workflow_run was successful
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "::warning::Release Please workflow did not succeed, skipping Docker build"
              echo "should-build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Get the latest release (created by Release Please)
            GIT_TAG=$(gh release list --limit 1 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName')

            if [ -z "$GIT_TAG" ]; then
              echo "::warning::No release found from Release Please workflow (might be just a push without release)"
              echo "should-build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Strip 'v' prefix for Docker tags (v3.6.0 -> 3.6.0)
            VERSION_TAG="${GIT_TAG#v}"
            IS_RELEASE="true"
            SHOULD_BUILD="true"
            CHECKOUT_REF="refs/tags/$GIT_TAG"
            echo "✅ Building Docker image for version: $VERSION_TAG (git tag: $GIT_TAG) from Release Please workflow"

          # workflow_dispatch - manual trigger with build type selection
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_TYPE="${{ inputs.build_type }}"

            case "$BUILD_TYPE" in
              release)
                GIT_TAG="${{ inputs.version }}"

                # Validate version format
                if ! [[ "$GIT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Invalid version format: '$GIT_TAG'. Expected semantic version (e.g., v1.2.3)"
                  echo "should-build=false" >> "$GITHUB_OUTPUT"
                  exit 1
                fi

                # Check if release exists
                if ! gh release view "$GIT_TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
                  echo "::error::Release $GIT_TAG does not exist. Create release first via release-please workflow."
                  echo "should-build=false" >> "$GITHUB_OUTPUT"
                  exit 1
                fi

                # Strip 'v' prefix for Docker tags (v3.6.0 -> 3.6.0)
                VERSION_TAG="${GIT_TAG#v}"
                IS_RELEASE="true"
                SHOULD_BUILD="true"
                CHECKOUT_REF="refs/tags/$GIT_TAG"
                echo "✅ Manual Docker build for version: $VERSION_TAG (git tag: $GIT_TAG)"
                ;;

              edge)
                VERSION_TAG="edge"
                IS_RELEASE="false"
                SHOULD_BUILD="true"
                CHECKOUT_REF="refs/heads/${{ github.event.repository.default_branch }}"
                echo "✅ Edge build from ${{ github.event.repository.default_branch }} branch"
                ;;

              pr)
                PR_NUMBER="${{ inputs.pr_number }}"

                if [ -z "$PR_NUMBER" ]; then
                  echo "::error::PR number is required for PR builds"
                  echo "should-build=false" >> "$GITHUB_OUTPUT"
                  exit 1
                fi

                VERSION_TAG="pr-$PR_NUMBER"
                IS_RELEASE="false"
                SHOULD_BUILD="true"
                CHECKOUT_REF="refs/pull/$PR_NUMBER/head"
                echo "✅ PR build for PR #$PR_NUMBER (from refs/pull/$PR_NUMBER/head)"
                ;;

              *)
                echo "::error::Unknown build type: $BUILD_TYPE"
                SHOULD_BUILD="false"
                ;;
            esac

          else
            echo "::warning::Unknown trigger, skipping build"
            SHOULD_BUILD="false"
          fi

          {
            echo "version-tag=$VERSION_TAG"
            echo "git-tag=$GIT_TAG"
            echo "is-release=$IS_RELEASE"
            echo "should-build=$SHOULD_BUILD"
            echo "checkout-ref=$CHECKOUT_REF"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: extract-version
    if: needs.extract-version.outputs.should-build == 'true'

    permissions:
      contents: read
      packages: write
      id-token: write  # For Cosign keyless signing
      attestations: write  # For build attestations
      security-events: write  # For uploading Trivy SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.extract-version.outputs.checkout-ref }}

      - name: Get build info
        id: build-info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --format=%s)
          COMMIT_DATE=$(git log -1 --format=%ci)

          # Get package version from package.json
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          {
            echo "commit-sha=$COMMIT_SHA"
            echo "commit-short=$COMMIT_SHORT"
            echo "commit-msg=$COMMIT_MSG"
            echo "commit-date=$COMMIT_DATE"
            echo "package-version=$PACKAGE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c7c4c00f3eef127be487a50899a220e44c6bcc87

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@0567fa5ae8c9a197cb207537dc5cbb43ca3d803f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@ed95091677497158a9ff38b314264cd965388d5e
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ needs.extract-version.outputs.is-release == 'true' }},priority=1000
            type=raw,value=${{ needs.extract-version.outputs.version-tag }},enable=${{ needs.extract-version.outputs.is-release == 'true' }},priority=900
            type=edge,enable=${{ needs.extract-version.outputs.version-tag == 'edge' }},priority=800
            type=raw,value=${{ needs.extract-version.outputs.version-tag }},enable=${{ startsWith(needs.extract-version.outputs.version-tag, 'pr-') }},priority=700

      - name: Download dist/ artifact from GitHub Release (release builds only)
        if: needs.extract-version.outputs.is-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GIT_TAG="${{ needs.extract-version.outputs.git-tag }}"
          echo "📦 Downloading dist.tar.gz from release $GIT_TAG"

          gh release download "$GIT_TAG" \
            --repo ${{ github.repository }} \
            --pattern 'dist.tar.gz'

          echo "📂 Extracting dist.tar.gz"
          tar xzf dist.tar.gz

          echo "✓ dist/ artifact ready ($(du -sh dist | cut -f1))"
          ls -lh dist/

      - name: Set up Node.js (non-release builds)
        if: needs.extract-version.outputs.is-release == 'false'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'

      - name: Install npm 11.6.4 (non-release builds)
        if: needs.extract-version.outputs.is-release == 'false'
        run: npm install -g npm@11.6.4

      - name: Install dependencies (non-release builds)
        if: needs.extract-version.outputs.is-release == 'false'
        run: npm ci

      - name: Build (non-release builds)
        if: needs.extract-version.outputs.is-release == 'false'
        run: npm run build

      - name: Build and push Docker image (release builds with artifact)
        if: needs.extract-version.outputs.is-release == 'true'
        id: build-and-push-release
        uses: docker/build-push-action@64c9b141502b80dbbd71e008a0130ad330f480f8
        with:
          context: .
          file: Dockerfile
          target: release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push Docker image (development builds from source)
        if: needs.extract-version.outputs.is-release == 'false'
        id: build-and-push-dev
        uses: docker/build-push-action@64c9b141502b80dbbd71e008a0130ad330f480f8
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Set digest output
        id: digest
        run: |
          if [ "${{ needs.extract-version.outputs.is-release }}" = "true" ]; then
            echo "digest=${{ steps.build-and-push-release.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "digest=${{ steps.build-and-push-dev.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.digest.outputs.digest }}"

      # Vulnerability Scanning with Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@22438a435773de8c97dc0958cc0b823c45b064ac
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@32d41f36fe7c3d2125b2ef434749e8f445ec42cf
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # Image Signing with Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@430b6a704fe0c92f1b1261d84376a900f38d90ff

      - name: Sign container image with Cosign
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          echo "Signing image with digest: ${DIGEST}"
          cosign sign --yes --recursive \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      # Send webhook notification when 'latest' tag is published
      - name: Send webhook for latest tag publication
        if: needs.extract-version.outputs.is-release == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DOCKER_PUBLISH_LATEST_WEBHOOK }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DOCKER_PUBLISH_LATEST_WEBHOOK secret not set, skipping webhook"
            exit 0
          fi

          if [ -z "$CLIENT_ID" ]; then
            echo "::warning::CF_ACCESS_CLIENT_ID secret not set, skipping webhook"
            exit 0
          fi

          if [ -z "$CLIENT_SECRET" ]; then
            echo "::warning::CF_ACCESS_CLIENT_SECRET secret not set, skipping webhook"
            exit 0
          fi

          echo "Sending webhook notification for latest tag publication..."

          # Send POST request to webhook
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "User-Agent: GitHub-Actions" \
            -H "CF-Access-Client-Id: $CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLIENT_SECRET" \
            "$WEBHOOK_URL")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "::notice::✓ Webhook sent successfully (HTTP $HTTP_CODE)"
          else
            echo "::error::✗ Webhook failed with HTTP $HTTP_CODE"
          fi

      # Generate Job Summary
      - name: Generate build summary
        if: always()
        run: |
          VERSION_TAG="${{ needs.extract-version.outputs.version-tag }}"
          IS_RELEASE="${{ needs.extract-version.outputs.is-release }}"
          CHECKOUT_REF="${{ needs.extract-version.outputs.checkout-ref }}"
          COMMIT_SHA="${{ steps.build-info.outputs.commit-sha }}"
          COMMIT_SHORT="${{ steps.build-info.outputs.commit-short }}"
          COMMIT_MSG="${{ steps.build-info.outputs.commit-msg }}"
          COMMIT_DATE="${{ steps.build-info.outputs.commit-date }}"
          PACKAGE_VERSION="${{ steps.build-info.outputs.package-version }}"
          DIGEST="${{ steps.digest.outputs.digest }}"

          # Determine build type label
          if [ "$IS_RELEASE" = "true" ]; then
            BUILD_TYPE="🚀 Release"
          elif [ "$VERSION_TAG" = "edge" ]; then
            BUILD_TYPE="🔧 Edge (Development)"
          elif [[ "$VERSION_TAG" == pr-* ]]; then
            BUILD_TYPE="🔍 Pull Request"
          else
            BUILD_TYPE="❓ Unknown"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## 🐳 Docker Build Summary

          ### Build Information

          | Property | Value |
          |----------|-------|
          | **Build Type** | $BUILD_TYPE |
          | **Version Tag** | \`$VERSION_TAG\` |
          | **Package Version** | \`$PACKAGE_VERSION\` |

          ### Source

          | Property | Value |
          |----------|-------|
          | **Checkout Ref** | \`$CHECKOUT_REF\` |
          | **Commit SHA** | \`$COMMIT_SHA\` |
          | **Commit (short)** | \`$COMMIT_SHORT\` |
          | **Commit Date** | $COMMIT_DATE |
          | **Commit Message** | $COMMIT_MSG |

          ### Docker Image

          | Property | Value |
          |----------|-------|
          | **Registry** | \`${{ env.REGISTRY }}\` |
          | **Image** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |
          | **Digest** | \`$DIGEST\` |
          | **Platforms** | \`linux/amd64\`, \`linux/arm64\` |

          ### Image Tags

          \`\`\`
          ${{ steps.meta.outputs.tags }}
          \`\`\`

          ### Pull Command

          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION_TAG
          \`\`\`

          ### Inspect Command

          \`\`\`bash
          npx @modelcontextprotocol/inspector docker run --rm -i ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION_TAG
          \`\`\`
          EOF
