name: 1. Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3) — no "v" prefix'
        required: true
        type: string

# Minimal permissions at workflow level (principle of least privilege)
permissions: read-all

jobs:
  prepare-release:
    name: Prepare Release Branch
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Required for creating branches and pushing
      pull-requests: write  # Required for creating pull request

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          disable-sudo: 'true'
          egress-policy: 'audit'

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: '$VERSION'"
            echo "Expected: x.y.z (e.g., 1.2.3) — no 'v' prefix"
            exit 1
          fi
          echo "✅ Version format valid: $VERSION"

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Full history required for git-cliff changelog generation

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        run: |
          VERSION="${{ inputs.version }}"
          BRANCH="release/${VERSION}"
          git checkout -b "$BRANCH"
          echo "✅ Created branch: $BRANCH"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install npm 11.12.1
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Bump version in package.json and package-lock.json
        run: |
          VERSION="${{ inputs.version }}"
          npm version "$VERSION" --no-git-tag-version
          echo "✅ Version bumped to $VERSION"
          echo "package.json: $(node -p "require('./package.json').version")"

      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ inputs.version }}"
          ./node_modules/.bin/git-cliff --tag "v${VERSION}" --unreleased --prepend CHANGELOG.md
          echo "✅ CHANGELOG.md updated with entries for v${VERSION}"

      - name: Commit changes
        run: |
          VERSION="${{ inputs.version }}"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          echo "✅ Changes committed"

      - name: Push release branch
        run: |
          VERSION="${{ inputs.version }}"
          git push -u origin "release/${VERSION}"
          echo "✅ Branch pushed: release/${VERSION}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cat > /tmp/pr-body.md << EOF
          ## Release v${VERSION}

          This PR prepares the release of version \`${VERSION}\`.

          ### Changes included

          - \`package.json\` — version bumped to \`${VERSION}\`
          - \`package-lock.json\` — version bumped to \`${VERSION}\`
          - \`CHANGELOG.md\` — new entries generated by git-cliff

          ### Next steps after merging

          1. Run **Publish NPM** workflow with version \`${VERSION}\`
          2. Run **Docker Build and Publish** workflow with \`build_type=release\` and version \`${VERSION}\`
          EOF

          gh pr create \
            --title "chore(release): v${VERSION}" \
            --body-file /tmp/pr-body.md \
            --base master \
            --head "release/${VERSION}"

          echo "✅ Pull request created: release/${VERSION} → master"
