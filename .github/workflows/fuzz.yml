name: Fuzzing with ClusterFuzzLite

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["**"]
  # Run fuzzing on a schedule (weekly)
  schedule:
    - cron: "0 2 * * 1"  # Every Monday at 2 AM UTC
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  issues: write  # For filing issues on findings
  security-events: write  # For uploading SARIF results

jobs:
  # Detect which files changed to conditionally run fuzzing
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # Only check changes for pull_request events
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for file changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'biome.json'
              - 'Dockerfile*'
              - '.dockerignore'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'lefthook.yml'
              - '.c8rc.json'
              - '.nvmrc'
              - '.npmrc'
              - 'server.json'
              - '.env.example'
              - '.ossfuzz/Dockerfile'

  # Fast fuzzing run on PRs (5 minutes)
  fuzz-pr:
    name: Fuzzing (Pull Request)
    needs: changes
    # Run if: PR event AND code changed
    if: |
      github.event_name == 'pull_request' &&
      (needs.changes.result == 'skipped' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install npm 11.12.1
        shell: bash
        run: npm install -g npm@11.12.1

      - name: Install Dependencies
        run: npm ci

      - name: Run property-based fuzzing tests
        run: npm run test:fuzz
        timeout-minutes: 10

  # Extended fuzzing run on main/master and schedule (30 minutes)
  fuzz-extended-address:
    name: Fuzzing (Extended)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install npm 11.12.1
        shell: bash
        run: npm install -g npm@11.12.1

      - name: Install Dependencies
        run: npm ci

      - name: Run property-based fuzzing tests (extended)
        run: npm run test:fuzz
        timeout-minutes: 30
        env:
          # Increase number of runs for extended fuzzing
          FUZZ_RUNS: "5000"

      - name: Upload fuzzing results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-results-node24-address
          path: |
            coverage/
            .fuzz-results/
          retention-days: 30

  # Continuous fuzzing summary
  fuzz-summary:
    name: Fuzzing Summary
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: [fuzz-extended-address]
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fuzzing summary
        run: |
          {
            echo "# Fuzzing Summary"
            echo ""
            echo "Fuzzing completed for commit ${{ github.sha }}"
            echo ""
            echo "## Fuzz Test Components"
            echo "- Tag Parser (parseTagInput)"
            echo "- Tag Validation (validateTag)"
            echo "- Schema Loader (translation methods)"
            echo ""
            echo "## Coverage"
            echo "Property-based testing with fast-check library"
            echo ""
            echo "See artifacts for detailed results."
          } >> "$GITHUB_STEP_SUMMARY"
